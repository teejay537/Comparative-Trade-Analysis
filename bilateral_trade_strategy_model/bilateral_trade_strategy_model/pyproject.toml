[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilateral-trade-strategy-model"
version = "0.1.0"
description = "Decision model for bilateral tariff-negotiation priorities and tradeoffs."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
